# config.yaml
crawler:
  max_workers: 4
  download_dir: downloaded_files
  crawl_delay_seconds: 0.35
  max_download_bytes: 10485760
  allowed_domains: []
  denied_extensions: [".jpg", ".jpeg", ".png"]
  user_agent: exam_crawler/1.0

google:
  api_key_env: GOOGLE_API_KEY
  cse_id_env: GOOGLE_CSE_ID
  per_page: 10
  max_start_index: 91

question_generator:
  enabled: true
  provider: local_hf            # important: not "huggingface" API
  model: google/flan-t5-large   # current env-safe model
  num_questions: 10
  device: -1  
  max_new_tokens: 160           # lower for cleaner output
  temperature: 0.2              # deterministic with do_sample false
  do_sample: false
  hf_token_env: HF_TOKEN        # optional for download speed/rate
