# config.yaml
crawler:
  max_workers: 4
  download_dir: downloaded_files
  crawl_delay_seconds: 0.35
  max_download_bytes: 10485760
  allowed_domains: []
  denied_extensions: [".jpg", ".jpeg", ".png"]
  user_agent: exam_crawler/1.0

google:
  api_key_env: GOOGLE_API_KEY
  cse_id_env: GOOGLE_CSE_ID
  per_page: 10
  max_start_index: 91

question_generator:
  enabled: true
  provider: local_hf
  model: google/flan-t5-large
  num_questions: 10
  device: -1
  max_new_tokens: 320
  min_new_tokens: 12
  temperature: 0.7
  do_sample: true
  top_p: 0.9
  hf_token_env: HF_TOKEN
